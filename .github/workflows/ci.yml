name: CI

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  quality:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.85"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo check --all-targets --all-features
      - run: cargo test --all-targets --all-features

  generated-data:
    name: Generated data and verification tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tools -p 'test_*.py' -v
      - run: python -m unittest discover -s verification/tests -v
      - run: python tools/hsk_data.py validate-config
      - run: python tools/hsk_data.py validate --source hsk2015 --canonical data/hsk-sources/canonical/hsk2015.csv
      - run: python tools/hsk_data.py validate --source proficiency2021 --canonical data/hsk-sources/canonical/proficiency2021.csv
      - run: python tools/hsk_data.py validate --source hsk_exam2025 --canonical data/hsk-sources/canonical/hsk_exam2025.csv
