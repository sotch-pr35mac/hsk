[package]
name = "hsk"
version = "1.0.0"
authors = ["Preston Wang-Stosur-Bassett <p.wanstobas@gmail.com>"]
description = "Return versioned HSK level for Simplified Chinese characters"
repository = "https://github.com/sotch-pr35mac/hsk"
readme = "README.md"
keywords = ["chinese", "hanzi", "hsk"]
categories = ["text-processing"]
license = "MIT"
edition = "2024"
rust-version = "1.85"
include = [
    "/README.md",
    "/CHANGELOG.md",
    "/MIGRATION.md",
    "/data/hsk.data",
    "/src/**",
    "/tests/**",
    "/benches/**",
    "LICENSE",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
unicode-normalization = "0.1.25"

[dev-dependencies]
criterion = { version = "0.7.0", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "lookup"
harness = false
